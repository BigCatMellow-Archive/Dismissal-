<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1eb">
  <title>Dismissal · Runner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-copy">
      <span class="appbar-kicker">Dismissal</span>
      <strong class="appbar-title">Runner</strong>
    </div>
    <button class="icon-button" type="button" data-app-menu aria-label="Open menu">Menu</button>
  </header>

  <main>
    <div class="prototype-chip">Demo data only</div>

    <button class="runner-identity" id="identityButton" type="button">
      <span>Working as<strong id="runnerName">Not set</strong></span>
      <span class="change">Change</span>
    </button>

    <section class="screen-head">
      <h1>Who needs you?</h1>
      <p>Tap a student. The next step will appear. You do not need to remember the process.</p>
    </section>

    <div class="section-label">Students waiting</div>
    <section class="queue" id="queue" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
  <script>
    const queue = document.querySelector('#queue');
    const runnerName = document.querySelector('#runnerName');

    function actor() {
      return DismissalApp.getActor() || 'Runner';
    }

    function refresh() {
      runnerName.textContent = DismissalApp.getActor() || 'Not set';
      DismissalApp.renderQueue(queue, { role: 'runner', actor: actor(), onChange: refresh });
    }

    function askName(required = false) {
      DismissalApp.openNameModal({ required, onSave: refresh });
    }

    document.querySelector('#identityButton').addEventListener('click', () => askName(false));
    DismissalApp.bindMenu('runner');
    DismissalApp.bindLiveRefresh(refresh);
    refresh();
    if (!DismissalApp.getActor()) askName(true);
    setInterval(DismissalApp.updateTimers, 1000);
  </script>
</body>
</html>
