<script>
(() => {
  // Apps Script HTML Service cannot reliably use getUserMedia() inside its
  // sandbox. The live scanner therefore runs as a normal top-level HTTPS page
  // on GitHub Pages and sends decoded barcode values back to this authenticated
  // Apps Script window. Server-side role checks still apply to every scan.

  const CAMERA_ORIGIN = 'https://bigcatmellow-archive.github.io';
  const CAMERA_URL = CAMERA_ORIGIN + '/Dismissal-/camera.html';
  let cameraWindow = null;
  let session = '';
  let busy = false;

  function makeSession() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'cam-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }

  function showMessage(title, detail, success) {
    const toast = document.querySelector('#toast');
    if (!toast) return;
    toast.className = 'toast ' + (success ? 'success' : 'error') + ' show';
    toast.innerHTML = '<div class="toast-title"></div><div class="toast-detail"></div>';
    toast.querySelector('.toast-title').textContent = title;
    toast.querySelector('.toast-detail').textContent = detail || '';
    window.setTimeout(() => toast.classList.remove('show'), success ? 2200 : 4200);
  }

  function openLiveScanner() {
    session = makeSession();
    const url = CAMERA_URL + '?session=' + encodeURIComponent(session);
    cameraWindow = window.open(url, 'DismissalLiveCamera');
    if (!cameraWindow) {
      showMessage('Could not open camera', 'Allow pop-ups for Dismissal, then try again.', false);
      return;
    }
    try { cameraWindow.focus(); } catch (_) {}
  }

  function sendToCamera(message) {
    if (!cameraWindow || cameraWindow.closed) return;
    try { cameraWindow.postMessage(message, CAMERA_ORIGIN); } catch (_) {}
  }

  window.addEventListener('message', event => {
    if (event.origin !== CAMERA_ORIGIN) return;
    const msg = event.data;
    if (!msg || msg.type !== 'dismissal-camera-scan' || msg.session !== session) return;
    if (busy) return;

    const code = String(msg.code || '').trim();
    if (!code) return;
    busy = true;

    google.script.run
      .withSuccessHandler(result => {
        busy = false;
        const names = [ ...(result.created || []), ...(result.existing || []) ]
          .map(item => item && item.student && item.student.name)
          .filter(Boolean);
        sendToCamera({
          type: 'dismissal-camera-result',
          session,
          ok: true,
          group: result.group && result.group.name ? result.group.name : 'Pickup called',
          names
        });
        showMessage(result.group && result.group.name ? result.group.name : 'Pickup called', names.join(', ') || 'Pickup called', true);
      })
      .withFailureHandler(err => {
        busy = false;
        const error = err && err.message ? err.message : String(err || 'Scan failed.');
        sendToCamera({ type: 'dismissal-camera-result', session, ok: false, error });
        showMessage('Scan not accepted', error, false);
      })
      .scanPickupGroup(code);
  });

  // Intercept Client.html's original iframe-camera button before its handler.
  document.addEventListener('click', event => {
    const button = event.target.closest && event.target.closest('#cameraButton');
    if (!button) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    openLiveScanner();
  }, true);
})();
</script>
