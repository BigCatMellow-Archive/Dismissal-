<style>
:root {
  --primary:#214289;
  --primary-hover:#1a356c;
  --accent:#f6b756;
  --accent-light:rgba(246,183,86,.12);
  --bg:#f0f2f7;

  --border:#e2e5eb;
  --text:#1f2937;
  --muted:#6b7280;
  --success:#059669;
  --error:#dc2626;
  --called:#f59e0b;
  --primary-light:rgba(33,66,137,.10);
  --success-light:rgba(5,150,105,.10);
  --error-light:rgba(220,38,38,.09);
  --called-light:rgba(245,158,11,.11);
  --radius:14px;
  --radius-sm:10px;
  --shadow-card:0 2px 5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-lifted:0 10px 30px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.06);

}
*{box-sizing:border-box} html{min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit} button{touch-action:manipulation} body.modal-open{overflow:hidden}
[hidden]{display:none!important}
.boot-screen{min-height:100vh;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted)}
.boot-mark{width:64px;height:64px;display:grid;place-items:center;border-radius:18px;background:var(--primary);color:#fff;font-size:1.6rem;font-weight:900;border-bottom:4px solid var(--accent)}
.appbar{position:sticky;top:0;z-index:30;min-height:72px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:9px 14px 8px;background:var(--primary);color:#fff;border-bottom:3px solid var(--accent);box-shadow:0 2px 8px rgba(33,66,137,.14)}
.appbar.admin-mode{grid-template-columns:auto minmax(120px,1fr) auto}.brand-block{min-width:0}.school-name{display:block;color:rgba(255,255,255,.7);font-size:.63rem;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.view-title{display:block;margin-top:2px;font-size:1.18rem;line-height:1.1}
.menu-button{min-height:44px;padding:0 16px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:850}.menu-button:active{background:rgba(255,255,255,.23)}
.header-search input{width:100%;min-height:46px;padding:10px 18px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;outline:none}.header-search input::placeholder{color:rgba(255,255,255,.67)}.header-search input:focus{background:rgba(255,255,255,.23);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
main{width:min(920px,100%);margin:0 auto;padding:20px 14px 54px}.screen-head{margin-bottom:18px}.screen-head h1{margin:0;font-size:clamp(1.75rem,8vw,2.5rem);line-height:1.04;letter-spacing:-.04em}.screen-head p{margin:7px 0 0;color:var(--muted);max-width:650px}
.identity-chip{display:inline-flex;align-items:center;gap:7px;margin-bottom:14px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-card);font-size:.78rem;color:var(--muted)}.identity-chip strong{color:var(--text)}
.summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}.summary-tile{min-height:86px;display:grid;align-content:center;padding:13px 15px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-card)}.summary-tile.attention{border-left:5px solid var(--error)}.summary-number{font-size:2rem;font-weight:900;color:var(--primary);line-height:1}.summary-tile.attention .summary-number{color:var(--error)}.summary-label{margin-top:5px;color:var(--muted);font-size:.8rem;font-weight:800}.completed-note{margin:0 2px 17px;color:var(--muted);font-size:.8rem}
.section-label{margin:16px 3px 9px;color:var(--muted);font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.queue{display:grid;gap:10px}
.student-card{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 15px 14px 13px;border:1px solid var(--border);border-left:5px solid #67bee2;border-radius:var(--radius);background:var(--surface);color:var(--text);box-shadow:var(--shadow-card);text-align:left;cursor:pointer}.student-card:active{transform:scale(.994)}.student-card.warn{border-left-color:var(--called)}.student-card.danger{border-left-color:var(--error)}.student-card.progress{border-left-color:var(--primary)}
.grade-badge{width:52px;height:52px;display:grid;place-items:center;border-radius:13px;background:#67bee2;color:#fff;font-weight:900;font-size:1.05rem}.student-card.warn .grade-badge{background:#ffcf33}.student-card.danger .grade-badge{background:#ef5b89}.student-card.progress .grade-badge{background:#5472b5}
.student-name{font-size:1.08rem;font-weight:900;line-height:1.18}.student-meta{margin-top:4px;color:var(--muted);font-size:.86rem}.pickup-meta{margin-top:2px;color:#7d8798;font-size:.77rem}.card-side{text-align:right;min-width:84px}.wait{font-size:1.22rem;font-weight:900;color:var(--primary);font-variant-numeric:tabular-nums}.status{margin-top:5px;color:var(--muted);font-size:.72rem;font-weight:800;max-width:135px}.chevron{margin-left:6px;color:#c2c8d2;font-size:1.7rem;line-height:1}
.empty-state{min-height:220px;display:grid;place-items:center;align-content:center;gap:7px;padding:28px;border:1px dashed var(--border);border-radius:var(--radius);background:rgba(255,255,255,.46);text-align:center;color:var(--muted)}.empty-state strong{color:var(--text);font-size:1.15rem}.empty-icon{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;background:var(--success-light);color:var(--success);font-size:1.5rem;font-weight:900}
.scan-stage{min-height:calc(100vh - 160px);display:grid;align-content:center;text-align:center;gap:13px}.scan-mark{width:112px;height:112px;display:grid;place-items:center;margin:0 auto;border-radius:50%;background:var(--surface);border:8px solid var(--primary-light);color:var(--primary);box-shadow:var(--shadow-card);font-size:3rem;font-weight:900}.scan-stage h1{margin:0;font-size:clamp(2.1rem,11vw,3.4rem);line-height:1}.scan-stage p{margin:0;color:var(--muted)}.scan-ready{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:3px auto 9px;padding:7px 12px;border-radius:999px;background:var(--primary-light);color:var(--primary);font-size:.76rem;font-weight:900;letter-spacing:.06em}.scan-ready:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--success)}.scan-hidden{position:fixed;left:-20px;top:-20px;width:1px;height:1px;opacity:.01}.big-button{width:100%;min-height:60px;border:0;border-radius:var(--radius);background:var(--primary);color:#fff;font-weight:900;box-shadow:var(--shadow-card)}.big-button.secondary{background:var(--surface);color:var(--primary);border:1px solid var(--border)}.text-button{min-height:46px;border:0;background:transparent;color:var(--primary);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.directory-meta{margin:0 3px 10px;color:var(--muted);font-size:.77rem;font-weight:850;text-transform:uppercase;letter-spacing:.07em}.directory-list{display:grid;gap:10px}.directory-card{padding:15px;border:1px solid var(--border);border-left:5px solid #67bee2;border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-card)}.directory-card h2{margin:0;font-size:1.06rem}.directory-code{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:8px;background:var(--accent-light);color:#845707;font:800 .76rem ui-monospace,SFMono-Regular,Menlo,monospace}.directory-student{margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}.directory-student strong{display:block}.directory-student span{color:var(--muted);font-size:.8rem}
.toast{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bottom));z-index:70;max-width:620px;margin:auto;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-lifted);transform:translateY(140%);opacity:0;transition:.18s ease;pointer-events:none}.toast.show{transform:translateY(0);opacity:1}.toast.success{border-left:6px solid var(--success)}.toast.error{border-left:6px solid var(--error)}.toast-title{font-weight:900}.toast-detail{margin-top:4px;color:var(--muted);font-size:.82rem}
.modal-layer{position:fixed;inset:0;z-index:100;display:grid;align-items:end;visibility:hidden}.modal-layer.show{visibility:visible}.modal-backdrop{position:absolute;inset:0;background:rgba(17,24,39,.52);opacity:0;transition:.16s}.modal-layer.show .modal-backdrop{opacity:1}.modal-sheet{position:relative;width:100%;max-height:88vh;overflow:auto;padding:9px 16px calc(18px + var(--safe-bottom));border-radius:22px 22px 0 0;background:var(--surface);box-shadow:0 -10px 35px rgba(0,0,0,.18);transform:translateY(100%);transition:.18s}.modal-layer.show .modal-sheet{transform:translateY(0)}.modal-grab{width:44px;height:5px;margin:3px auto 15px;border-radius:99px;background:var(--border)}.modal-eyebrow{color:var(--primary);font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.modal-sheet h2{margin:4px 0 0;font-size:1.75rem;line-height:1.08}.modal-body{margin-top:13px;color:var(--muted)}.modal-person{padding:13px;border:1px solid var(--border);border-radius:var(--radius);background:#f7f8fb}.modal-person strong{display:block;color:var(--text);font-size:1.1rem}.modal-wait{margin-top:5px;color:var(--primary);font-weight:900}.modal-actions{display:grid;gap:9px;margin-top:17px}.modal-action{width:100%;min-height:60px;padding:11px 15px;border:1px solid var(--border);border-radius:var(--radius);background:#f7f8fb;color:var(--text);font-weight:900}.modal-action.primary{border-color:var(--primary);background:var(--primary);color:#fff}.modal-action.warning{border-color:rgba(245,158,11,.28);background:var(--called-light);color:#875807}.modal-action.danger{border-color:rgba(220,38,38,.23);background:var(--error-light);color:var(--error)}.modal-cancel{min-height:46px;border:0;background:transparent;color:var(--muted);font-weight:800}.menu-list{display:grid;gap:8px}.menu-link{min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-weight:850}.menu-link.current{background:var(--primary-light);border-color:rgba(33,66,137,.22);color:var(--primary)}
.error-screen{max-width:620px;margin:70px auto;padding:20px;border:1px solid rgba(220,38,38,.2);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-card)}.error-screen h1{margin:0 0 8px;font-size:1.5rem}.error-screen p{color:var(--muted)}
@media(max-width:600px){.appbar.admin-mode{grid-template-columns:auto minmax(0,1fr) auto}.header-search{grid-column:auto}.school-name{display:none}.view-title{font-size:1rem}.student-card{grid-template-columns:46px minmax(0,1fr) auto auto;padding:13px 12px 13px 10px;gap:10px}.grade-badge{width:46px;height:46px;border-radius:12px}.student-name{font-size:1rem}.card-side{min-width:70px}.wait{font-size:1.05rem}.status{font-size:.67rem}.chevron{font-size:1.45rem}}
@media(min-width:720px){.appbar{padding-left:24px;padding-right:24px}.modal-layer{align-items:center;justify-items:center;padding:20px}.modal-sheet{width:min(520px,100%);border-radius:18px;padding:18px 20px 20px;transform:translateY(20px) scale(.98);opacity:0;box-shadow:var(--shadow-lifted)}.modal-layer.show .modal-sheet{transform:none;opacity:1}.modal-grab{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
