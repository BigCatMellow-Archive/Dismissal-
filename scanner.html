<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1eb">
  <title>Dismissal · Scanner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-copy">
      <span class="appbar-kicker">Dismissal</span>
      <strong class="appbar-title">Scanner</strong>
    </div>
    <button class="icon-button" type="button" data-app-menu aria-label="Open menu">Menu</button>
  </header>

  <main>
    <div class="prototype-chip">Demo data only</div>

    <section class="scan-stage">
      <div class="scan-ready-mark" aria-hidden="true">▥</div>
      <h1>Scan a car</h1>
      <p class="scan-instruction">Point the barcode scanner at the family pass.</p>
      <div class="scan-state">Ready</div>

      <form id="scanForm" aria-label="Hardware barcode scanner input">
        <input class="scan-hidden-input" id="barcode" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="none" aria-label="Barcode scanner input">
      </form>

      <button class="big-button secondary" id="cameraButton" type="button">Use phone camera</button>
      <button class="help-button" id="helpButton" type="button">Can't scan?</button>
    </section>
  </main>

  <aside class="scan-feedback" id="scanFeedback" aria-live="assertive"></aside>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
  <script>
    const input = document.querySelector('#barcode');
    const form = document.querySelector('#scanForm');
    const feedback = document.querySelector('#scanFeedback');
    let feedbackTimer = null;
    let qr = null;

    function refocusScanner() {
      if (document.querySelector('#appModal:not([hidden])')) return;
      try { input.focus({ preventScroll: true }); } catch (_) { input.focus(); }
    }

    function showFeedback(result) {
      clearTimeout(feedbackTimer);
      feedback.className = 'scan-feedback';
      if (!result.ok) {
        feedback.classList.add('error');
        feedback.innerHTML = `<div class="feedback-head"><span class="feedback-icon">!</span><span>Not recognized</span></div><div class="feedback-students"><span>Try scanning again or use “Can't scan?”</span></div>`;
      } else {
        feedback.classList.add('success');
        const people = [...result.created, ...result.existing];
        feedback.innerHTML = `<div class="feedback-head"><span class="feedback-icon">✓</span><span>${DismissalApp.escapeHtml(result.group.name)}</span></div>
          <div class="feedback-students">${people.map(x => `<span>${DismissalApp.escapeHtml(x.student.name)} · Grade ${DismissalApp.escapeHtml(x.student.grade)}</span>`).join('')}
          ${result.existing.length ? '<span>Already waiting students were not duplicated.</span>' : ''}</div>`;
      }
      requestAnimationFrame(() => feedback.classList.add('show'));
      feedbackTimer = setTimeout(() => feedback.classList.remove('show'), result.ok ? 2300 : 4200);
      refocusScanner();
    }

    function handleCode(code) {
      const clean = String(code || '').trim();
      if (!clean) return;
      showFeedback(DismissalApp.scanPickupGroup(clean));
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      handleCode(input.value);
      input.value = '';
      refocusScanner();
    });

    function openManualEntry() {
      DismissalApp.openModal({
        eyebrow: 'Backup',
        title: 'Type the pickup code',
        body: '<label class="field-label" for="manualCode">Barcode number</label><input class="modal-input" id="manualCode" autocomplete="off" autocapitalize="characters" placeholder="Example: FAM-101">',
        actions: [{
          label: 'Find pickup',
          kind: 'primary',
          onClick: () => handleCode(document.querySelector('#manualCode')?.value)
        }]
      });
      setTimeout(() => document.querySelector('#manualCode')?.focus(), 60);
    }

    function openDemoChoices() {
      DismissalApp.openModal({
        eyebrow: 'Prototype',
        title: 'Choose a demo pass',
        body: '<p>These are fictional pickup groups for testing.</p>',
        actions: [
          { label: 'FAM-101 · 2 students', kind: 'secondary', onClick: () => handleCode('FAM-101') },
          { label: 'FAM-202 · 1 student', kind: 'secondary', onClick: () => handleCode('FAM-202') },
          { label: 'CARPOOL-303 · 2 students', kind: 'secondary', onClick: () => handleCode('CARPOOL-303') }
        ]
      });
    }

    document.querySelector('#helpButton').addEventListener('click', () => {
      DismissalApp.openModal({
        eyebrow: 'Backup options',
        title: "Can't scan the pass?",
        body: '<p>Use one of these only when the normal scanner is unavailable.</p>',
        actions: [
          { label: 'Type the code', kind: 'primary', onClick: () => setTimeout(openManualEntry, 180) },
          { label: 'Use a demo pass', kind: 'secondary', onClick: () => setTimeout(openDemoChoices, 180) }
        ]
      });
    });

    document.querySelector('#cameraButton').addEventListener('click', async () => {
      if (!window.Html5Qrcode) {
        showFeedback({ ok: false });
        return;
      }

      DismissalApp.openModal({
        eyebrow: 'Phone camera',
        title: 'Hold the barcode in the box',
        body: '<div id="reader"></div>',
        actions: [{
          label: 'Stop camera',
          kind: 'secondary',
          onClick: async () => {
            if (qr) await qr.stop().catch(() => {});
            qr = null;
          }
        }],
        dismissible: false
      });

      qr = new Html5Qrcode('reader');
      try {
        await qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 180 } }, async decoded => {
          handleCode(decoded);
          if (qr) await qr.stop().catch(() => {});
          qr = null;
          DismissalApp.closeModal();
        }, () => {});
      } catch (_) {
        qr = null;
        DismissalApp.closeModal();
        showFeedback({ ok: false });
      }
    });

    DismissalApp.bindMenu('scanner');
    window.addEventListener('load', refocusScanner);
    window.addEventListener('dismissal-modal-closed', () => setTimeout(refocusScanner, 0));
    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('button, a, input, #appModal')) setTimeout(refocusScanner, 0);
    });
  </script>
</body>
</html>
