<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#214289">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dismissal</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark">D</div>
    <strong>Loading Dismissal…</strong>
  </div>

  <header class="appbar" id="appbar" hidden>
    <div class="brand-block">
      <span class="school-name" id="schoolName">Dismissal</span>
      <strong class="view-title" id="viewTitle">Dismissal</strong>
    </div>
    <div class="header-search" id="headerSearch" hidden>
      <input id="directorySearch" type="search" autocomplete="off" placeholder="Name, Grade, or ID" aria-label="Search pickup directory">
    </div>
    <button class="menu-button" id="menuButton" type="button">Menu</button>
  </header>

  <main id="app" hidden></main>
  <div id="toast" class="toast" aria-live="assertive"></div>

  <div id="modal" class="modal-layer" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-grab"></div>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="demo.js?v=1"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
