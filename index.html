<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1eb">
  <title>Dismissal · Dispatcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-copy">
      <span class="appbar-kicker">Dismissal</span>
      <strong class="appbar-title">Dispatcher</strong>
    </div>
    <button class="icon-button" type="button" data-app-menu aria-label="Open menu">Menu</button>
  </header>

  <main>
    <div class="prototype-chip">Demo data only</div>

    <section class="screen-head">
      <h1>Who are we waiting on?</h1>
      <p>Oldest and problem pickups rise to the top. Tap a student only when you need to do something.</p>
    </section>

    <section class="summary-row" aria-label="Dismissal summary">
      <div class="summary-tile">
        <div class="summary-number" id="statActive">0</div>
        <div class="summary-label">Waiting now</div>
      </div>
      <div class="summary-tile attention">
        <div class="summary-number" id="statProblem">0</div>
        <div class="summary-label">Need attention</div>
      </div>
    </section>
    <div class="completed-note" id="completedNote">0 completed today</div>

    <div class="section-label">Students waiting</div>
    <section class="queue" id="queue" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
  <script>
    const queue = document.querySelector('#queue');

    function refresh() {
      DismissalApp.renderQueue(queue, { role: 'dispatcher', actor: 'Dispatcher', onChange: refresh });
      refreshStats();
    }

    function refreshStats() {
      const s = DismissalApp.stats();
      document.querySelector('#statActive').textContent = s.active;
      document.querySelector('#statProblem').textContent = s.problem;
      document.querySelector('#completedNote').textContent = `${s.completed} completed today`;
    }

    DismissalApp.bindMenu('dispatcher');
    DismissalApp.bindLiveRefresh(refresh);
    refresh();
    setInterval(() => {
      DismissalApp.updateTimers();
      refreshStats();
    }, 1000);
  </script>
</body>
</html>
